name: Deploy docs to GitHub Pages

# Deploys the pre-built HTML already committed on gh-pages, bypassing the
# default Jekyll build pipeline entirely (Jekyll was silently dropping every
# underscore-prefixed directory Sphinx generates -- _static, _images, etc. --
# even with a .nojekyll file present). Build the docs locally with
# `sphinx-build -b html docs/source docs/build/html` and push the result to
# gh-pages as before; this workflow only handles publishing that content.

on:
  push:
    branches: [gh-pages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
